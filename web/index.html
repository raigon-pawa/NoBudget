<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href argument of `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Balances, expenses, goals, debts and available credit in one place.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NoBudget">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NoBudget</title>
  <link rel="manifest" href="manifest.json">
  <!-- Black while the app loads, so there is no white flash. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #8a8a8a; font: 700 22px system-ui, sans-serif; letter-spacing: -.5px;
      animation: pulse 1s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading">NoBudget</div>
  <script>
    addEventListener('flutter-first-frame', () => document.getElementById('loading').remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
